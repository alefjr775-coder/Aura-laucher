name: Build Aura Launcher APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extrair projeto
        run: unzip -o aura_launcher_android_project.zip
      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Gerar APK
        run: cd AuraLauncherAndroid && gradle assembleDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v7
        with:
          name: AuraLauncher-APK
          path: AuraLauncherAndroid/app/build/outputs/apk/debug/app-debug.apk
          
